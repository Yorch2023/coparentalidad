// ── STATS ─────────────────────────────────────────────────────────────────────
function renderStats(){
  const wrap=el('div',{});
  const now=new Date();
  // Días de custodia (solo para detectar si hay datos, sin mostrar comparativa)
  const cd={J:0,E:0,ambos:0};
  S.events.forEach(ev=>{
    if(ev.changeStatus==='rechazado') return;
    let d=new Date(ev.from+'T12:00:00'),end=new Date(ev.to+'T12:00:00');
    while(d<=end){cd[ev.who]=(cd[ev.who]||0)+1;d.setDate(d.getDate()+1);}
  });
  const td=cd.J+cd.E+cd.ambos;

  // ── Monthly expenses last 6 months ──
  const monthly={};
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    monthly[key]={total:0,J:0,E:0,label:MONTHS[d.getMonth()]};
  }
  S.expenses.forEach(e=>{
    const key=e.date.slice(0,7);
    if(monthly[key]){
      const a=parseFloat(e.amount||0);
      monthly[key].total+=a;
      monthly[key][e.paidBy]=(monthly[key][e.paidBy]||0)+a;
    }
  });
  const entries=Object.entries(monthly);
  const maxVal=Math.max(...entries.map(([,v])=>v.total),1);

  if(entries.some(([,v])=>v.total>0)){
    const ec=el('div',{className:'card',style:{marginBottom:14}});
    ec.appendChild(titleIcon('chart','Gastos últimos 6 meses',{fontWeight:700,fontSize:14,marginBottom:14}));
    const chart=el('div',{style:{display:'flex',gap:6,alignItems:'flex-end',height:100,marginBottom:8}});
    entries.forEach(([key,v])=>{
      const col2=el('div',{style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3}});
      if(v.total>0) col2.appendChild(el('div',{style:{fontSize:9,color:'var(--ink-soft)',textAlign:'center'}},Math.round(v.total)+'€'));
      const barWrap=el('div',{style:{width:'100%',display:'flex',flexDirection:'column',justifyContent:'flex-end',height:80,gap:1}});
      // Stacked: Jorge on bottom, Eva on top
      const jH=Math.round((v.J/maxVal)*78);
      const eH=Math.round((v.E/maxVal)*78);
      if(v.E>0) barWrap.appendChild(el('div',{style:{width:'100%',height:eH+'px',background:'var(--eva)',borderRadius:'3px 3px 0 0',minHeight:v.E>0?3:0}}));
      if(v.J>0) barWrap.appendChild(el('div',{style:{width:'100%',height:jH+'px',background:'var(--jorge)',borderRadius:v.E>0?0:'3px 3px 0 0',minHeight:v.J>0?3:0}}));
      if(v.total===0) barWrap.appendChild(el('div',{style:{width:'100%',height:4,background:'var(--paper)',borderRadius:3}}));
      col2.appendChild(barWrap);
      col2.appendChild(el('div',{style:{fontSize:9,color:'var(--ink-soft)',textAlign:'center'}},v.label));
      chart.appendChild(col2);
    });
    ec.appendChild(chart);
    // Legend
    const leg=el('div',{style:{display:'flex',gap:14,marginTop:4}});
    [['var(--jorge)','Jorge'],['var(--eva)','Eva']].forEach(([c,l])=>{
      const d=el('div',{style:{display:'flex',alignItems:'center',gap:5}});
      d.append(el('div',{style:{width:10,height:10,borderRadius:2,background:c}}),el('span',{style:{fontSize:11,color:'var(--ink-soft)'}},l));
      leg.appendChild(d);
    });
    ec.appendChild(leg);
    wrap.appendChild(ec);
  }

  // ── Cuenta común: quién gasta y en qué ──
  const gastosComunes = S.expenses.filter(e=>e.cuentaComun);
  if(gastosComunes.length>0){
    const cc=el('div',{className:'card',style:{marginBottom:14,borderColor:'var(--ambos)'}});
    cc.appendChild(titleIcon('wallet','Cuenta común — quién gasta',{fontWeight:700,fontSize:14,marginBottom:4,color:'var(--ambos)'}));
    cc.appendChild(el('div',{style:{fontSize:11,color:'var(--ink-soft)',marginBottom:12}},'Gastos con cargo al fondo compartido. No generan saldo pendiente entre vosotros.'));

    const porPersona = {J:0, E:0};
    gastosComunes.forEach(e=>{ porPersona[e.paidBy] = (porPersona[e.paidBy]||0) + parseFloat(e.amount||0); });
    const totalComun = porPersona.J + porPersona.E;

    const barCC=el('div',{style:{display:'flex',height:14,borderRadius:7,overflow:'hidden',marginBottom:10}});
    if(porPersona.J>0) barCC.appendChild(el('div',{style:{flex:porPersona.J,background:'var(--jorge)'}}));
    if(porPersona.E>0) barCC.appendChild(el('div',{style:{flex:porPersona.E,background:'var(--eva)'}}));
    cc.appendChild(barCC);

    const rowCC=el('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:14}});
    [['J','Jorge','var(--jorge)'],['E','Eva','var(--eva)']].forEach(([k,l,color])=>{
      const s=el('div',{style:{textAlign:'center',padding:'10px 6px',background:'var(--bg)',borderRadius:10,border:'1px solid '+color+'22'}});
      s.append(
        el('div',{style:{fontWeight:800,fontSize:16,color:color}},fmtM(porPersona[k])),
        el('div',{style:{fontSize:11,color:'var(--ink-soft)',marginTop:2}},l+' · '+(totalComun>0?Math.round(porPersona[k]/totalComun*100):0)+'%')
      );
      rowCC.appendChild(s);
    });
    cc.appendChild(rowCC);

    // Por categoría dentro de la cuenta común
    const catComun={};
    gastosComunes.forEach(e=>{ catComun[e.cat]=(catComun[e.cat]||0)+parseFloat(e.amount||0); });
    const topCatComun=Object.entries(catComun).sort((a,b)=>b[1]-a[1]);
    if(topCatComun.length){
      cc.appendChild(el('div',{style:{fontSize:11,fontWeight:700,color:'var(--ink-soft)',marginBottom:8,textTransform:'uppercase',letterSpacing:.5}},'Por categoría'));
      topCatComun.forEach(([cat,amt])=>{
        const r=el('div',{style:{display:'flex',justifyContent:'space-between',padding:'5px 0',borderBottom:'1px solid var(--bg)'}});
        r.append(el('span',{style:{fontSize:12}},cat),el('span',{style:{fontSize:12,fontWeight:700}},fmtM(amt)+' ('+Math.round(amt/totalComun*100)+'%)'));
        cc.appendChild(r);
      });
    }

    // Por persona destinataria (Martina/Rodrigo/Carmen) dentro de la cuenta común
    const porHijo={};
    gastosComunes.forEach(e=>{ const p=e.persona||'Martina'; porHijo[p]=(porHijo[p]||0)+parseFloat(e.amount||0); });
    const topHijo=Object.entries(porHijo).sort((a,b)=>b[1]-a[1]);
    if(topHijo.length>1 || (topHijo.length===1 && topHijo[0][0]!=='Martina')){
      cc.appendChild(el('div',{style:{fontSize:11,fontWeight:700,color:'var(--ink-soft)',marginBottom:8,marginTop:12,textTransform:'uppercase',letterSpacing:.5}},'Por hijo/a'));
      topHijo.forEach(([persona,amt])=>{
        const r=el('div',{style:{display:'flex',justifyContent:'space-between',padding:'5px 0',borderBottom:'1px solid var(--bg)'}});
        r.append(el('span',{style:{fontSize:12}},persona),el('span',{style:{fontSize:12,fontWeight:700}},fmtM(amt)));
        cc.appendChild(r);
      });
    }

    cc.appendChild(el('div',{style:{display:'flex',justifyContent:'center',paddingTop:10,marginTop:10,borderTop:'1px solid var(--ambos)'}},[
      el('div',{style:{textAlign:'center'}},[el('div',{style:{fontWeight:800,fontSize:18,color:'var(--ambos)'}},fmtM(totalComun)),el('div',{style:{fontSize:11,color:'var(--ink-soft)'}},'Total cuenta común')])
    ]));
    wrap.appendChild(cc);
  }

  // ── Expense breakdown ──
  const byCat={};
  S.expenses.forEach(e=>{byCat[e.cat]=(byCat[e.cat]||0)+parseFloat(e.amount||0);});
  const topCats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const totalExp=S.expenses.reduce((s,e)=>s+parseFloat(e.amount||0),0);

  if(topCats.length>0){
    const bc=el('div',{className:'card',style:{marginBottom:14}});
    bc.appendChild(titleIcon('chart','Gastos por categoría',{fontWeight:700,fontSize:14,marginBottom:12}));
    topCats.forEach(([cat,amt])=>{
      const r=el('div',{style:{marginBottom:10}});
      const t=el('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:4}});
      t.append(el('span',{style:{fontSize:13}},cat),el('span',{style:{fontSize:13,fontWeight:700}},fmtM(amt)+' ('+Math.round(amt/totalExp*100)+'%)'));
      const barWrap=el('div',{style:{height:6,background:'var(--bg)',borderRadius:3,overflow:'hidden'}});
      barWrap.appendChild(el('div',{style:{height:'100%',background:'var(--jorge)',width:(amt/totalExp*100)+'%',borderRadius:3}}));
      r.append(t,barWrap);bc.appendChild(r);
    });
    // Totals
    const pend=S.expenses.filter(e=>e.status==='pendiente').reduce((s,e)=>s+parseFloat(e.amount||0),0);
    bc.appendChild(el('div',{style:{display:'flex',justifyContent:'space-between',paddingTop:10,borderTop:'1px solid var(--bg)',marginTop:4}},[
      el('div',{style:{textAlign:'center'}},[el('div',{style:{fontWeight:800,fontSize:16}},fmtM(totalExp)),el('div',{style:{fontSize:11,color:'var(--ink-soft)'}},'Total')]),
      el('div',{style:{textAlign:'center'}},[el('div',{style:{fontWeight:800,fontSize:16,color:'var(--alert)'}},fmtM(pend)),el('div',{style:{fontSize:11,color:'var(--ink-soft)'}},'Pendiente')]),
      el('div',{style:{textAlign:'center'}},[el('div',{style:{fontWeight:800,fontSize:16,color:'var(--ambos)'}},fmtM(totalExp-pend)),el('div',{style:{fontSize:11,color:'var(--ink-soft)'}},'Liquidado')]),
    ]));
    wrap.appendChild(bc);
  }

  // ── Agreements by category ──
  const byAg={};
  S.agreements.filter(a=>a.status==='activo').forEach(a=>{byAg[a.category]=(byAg[a.category]||0)+1;});
  if(Object.keys(byAg).length>0){
    const ac=el('div',{className:'card'});
    ac.appendChild(titleIcon('doc','Acuerdos activos por área',{fontWeight:700,fontSize:14,marginBottom:10}));
    Object.entries(byAg).sort((a,b)=>b[1]-a[1]).forEach(([cat,n])=>{
      const r=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 0',borderBottom:'1px solid var(--bg)'}});
      r.append(el('span',{style:{fontSize:13}},cat),badge(String(n),'badge-J'));
      ac.appendChild(r);
    });
    wrap.appendChild(ac);
  }

  const hasAnyStatsContent = entries.some(([,v])=>v.total>0) || topCats.length>0 || Object.keys(byAg).length>0 || getActivityLog().length>0;
  if(!hasAnyStatsContent) wrap.appendChild(el('div',{style:{textAlign:'center',color:'var(--ink-soft)',padding:'40px 0',fontSize:13}},'Añade gastos o acuerdos para ver las estadísticas'));

  // Activity log
  const logs=getActivityLog();
  if(logs.length>0){
    const lc=el('div',{className:'card',style:{marginTop:14}});
    lc.appendChild(titleIcon('clock','Historial de actividad',{fontWeight:700,fontSize:14,marginBottom:12}));
    logs.slice(0,20).forEach(l=>{
      const r=el('div',{style:{display:'flex',gap:10,padding:'7px 0',borderBottom:'1px solid var(--bg)',alignItems:'start'}});
      r.append(
        badge(l.user==='J'?'Jorge':'Eva','badge-'+(l.user==='J'?'J':'E')),
        el('div',{style:{flex:1}},[
          el('div',{style:{fontSize:12}},l.action+' '+l.entity+': '+l.detail),
          el('div',{style:{fontSize:10,color:'var(--ink-soft)',marginTop:2}},new Date(l.ts).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}))
        ])
      );
      lc.appendChild(r);
    });
    if(logs.length>20) lc.appendChild(el('div',{style:{fontSize:11,color:'var(--ink-soft)',padding:'6px 0'}},'Mostrando 20 de '+logs.length+' entradas'));
    wrap.appendChild(lc);
  }

  return wrap;
}

// ── INTERCAMBIO ───────────────────────────────────────────────────────────────
function renderIntercambio(){
  const wrap=el('div',{});
  if(!S.checklist) S.checklist=loadChecklist();

  // Recordatorios por email
  const notifCard=el('div',{className:'card',style:{marginBottom:14}});
  notifCard.appendChild(titleIcon('bell','Recordatorios de cambio',{fontWeight:700,fontSize:14,marginBottom:8}));
  notifCard.append(
    titleIcon('check','Activos por email',{fontSize:12,color:'var(--ambos)',marginBottom:6,fontWeight:600}),
    el('div',{style:{fontSize:11,color:'var(--ink-soft)',lineHeight:1.5}},'Cuando un cambio de custodia real esté a la antelación configurada abajo, se envía un email automático a ambos correos — no depende de tener la app abierta ni de permisos del navegador.')
  );
  wrap.appendChild(notifCard);

  // Alert config — siempre visible, conectado a email real
  const ac=el('div',{className:'card',style:{marginBottom:14}});
  const ach=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}});
  ach.append(
    el('div',{},[
      titleIcon('gear','Configurar antelación',{fontWeight:700,fontSize:14}),
      el('div',{style:{fontSize:11,color:'var(--ink-soft)',marginTop:2}},'¿Con cuántos días de antelación quieres el aviso?')
    ]),
    el('button',{className:'btn-ghost',style:{fontSize:11},onClick:()=>{UI.showAlertConfig=!UI.showAlertConfig;render();}},UI.showAlertConfig?'Cerrar':'Editar')
  );
  ac.appendChild(ach);
  if(UI.showAlertConfig){
    const optWrap=el('div',{style:{display:'flex',gap:8}});
    [1,2,3,7].forEach(d=>{
      const active=UI.alertDaysBefore===d;
      optWrap.appendChild(el('button',{
        style:{flex:1,padding:'10px 4px',borderRadius:9,border:'1px solid',borderColor:active?'var(--jorge)':'var(--line)',background:active?'var(--jorge-soft)':'transparent',color:active?'var(--jorge)':'var(--ink-soft)',fontWeight:active?700:400,fontSize:12},
        onClick:()=>{saveAlertConfig(d);render();}
      },d===1?'1 día':d===7?'1 semana':d+' días'));
    });
    ac.appendChild(optWrap);
    ac.appendChild(el('div',{style:{fontSize:11,color:'var(--ink-soft)',marginTop:10}},'Aviso actual: '+(UI.alertDaysBefore===1?'1 día':UI.alertDaysBefore===7?'1 semana':UI.alertDaysBefore+' días')+' antes del cambio, por email a ambos.'));
  } else {
    ac.appendChild(el('div',{style:{fontSize:13,color:'var(--ink-soft)'}},'Avisas '+(UI.alertDaysBefore===1?'1 día':UI.alertDaysBefore===7?'1 semana':UI.alertDaysBefore+' días')+' antes de cada cambio, por email a ambos.'));
  }
  wrap.appendChild(ac);

  // Next handover info
  const todayStr=today();
  const nextEv=[...S.events].filter(ev=>ev.from>=todayStr&&ev.changeStatus!=='rechazado').sort((a,b)=>a.from.localeCompare(b.from))[0];
  if(nextEv){
    const nc=el('div',{className:'today-card',style:{marginBottom:14}});
    nc.append(
      el('div',{style:{fontSize:11,color:'var(--ink-soft)',marginBottom:6,textTransform:'uppercase',letterSpacing:.5}},'Próximo intercambio'),
      el('div',{style:{fontWeight:800,fontSize:20,color:CUSTODY_TEXT[nextEv.who],marginBottom:4}},'Con '+nameOf(nextEv.who)),
      el('div',{style:{fontSize:13,color:'var(--ink-soft)'}},fmt(nextEv.from)+' · '+(daysUntil(nextEv.from)===0?'HOY':daysUntil(nextEv.from)===1?'Mañana':'En '+daysUntil(nextEv.from)+' días'))
    );
    wrap.appendChild(nc);
  }

  // Checklist
  const cc=el('div',{className:'card'});
  const ch=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}});
  const done=S.checklist.filter(i=>i.done).length;
  ch.append(
    el('div',{},[
      titleIcon('check','Checklist de intercambio',{fontWeight:700,fontSize:14}),
      el('div',{style:{fontSize:11,color:'var(--ink-soft)',marginTop:2}},done+'/'+S.checklist.length+' completados')
    ]),
    el('button',{className:'btn-ghost',style:{fontSize:11},onClick:()=>{
      S.checklist=S.checklist.map(i=>({...i,done:false}));
      saveChecklist(S.checklist);render();
    }},'Resetear')
  );
  cc.appendChild(ch);

  // Progress bar
  const prog=el('div',{style:{height:6,background:'var(--paper)',borderRadius:3,overflow:'hidden',marginBottom:14}});
  prog.appendChild(el('div',{style:{height:'100%',background:'var(--jorge)',width:(S.checklist.length?done/S.checklist.length*100:0)+'%',borderRadius:3,transition:'width .3s'}}));
  cc.appendChild(prog);

  S.checklist.forEach((item,idx)=>{
    const r=el('div',{style:{display:'flex',alignItems:'center',gap:10,padding:'9px 0',borderBottom:'1px solid var(--bg)'}});
    const chk=el('button',{
      style:{width:22,height:22,borderRadius:5,border:'1px solid',borderColor:item.done?'var(--jorge)':'var(--line)',background:item.done?'var(--jorge)':'transparent',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:12},
      onClick:()=>{S.checklist[idx].done=!S.checklist[idx].done;saveChecklist(S.checklist);render();}
    },item.done?'✓':'');
    r.append(chk,el('div',{style:{flex:1,fontSize:13,color:item.done?'var(--ink-soft)':'var(--ink)',textDecoration:item.done?'line-through':'none'}},item.text));
    // Delete button
    r.appendChild(el('button',{style:{background:'none',border:'none',color:'var(--line)',fontSize:12,cursor:'pointer'},onClick:()=>{S.checklist.splice(idx,1);saveChecklist(S.checklist);render();}},'✕'));
    cc.appendChild(r);
  });

  // Add item
  const addRow=el('div',{style:{display:'flex',gap:8,marginTop:12}});
  const newInp=el('input',{className:'input',placeholder:'Añadir elemento al checklist…',style:{flex:1}});
  newInp.value=UI.checklistItem||'';
  newInp.addEventListener('input',e=>UI.checklistItem=e.target.value);
  newInp.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&newInp.value.trim()){
      S.checklist.push({id:Date.now(),text:newInp.value.trim(),done:false});
      saveChecklist(S.checklist);UI.checklistItem='';render();
    }
  });
  addRow.append(newInp,el('button',{className:'btn-primary',style:{flexShrink:0,padding:'10px 14px'},onClick:()=>{
    if(newInp.value.trim()){
      S.checklist.push({id:Date.now(),text:newInp.value.trim(),done:false});
      saveChecklist(S.checklist);UI.checklistItem='';render();
    }
  }},'+'));
  cc.appendChild(addRow);
  wrap.appendChild(cc);
  return wrap;
}

// ── Init ──────────────────────────────────────────────────────────────────────
UI.weekOffset = 0;
UI.loginEmail = ''; UI.loginPass = ''; UI.loginError = '';
// Timeout fallback: if still loading after 10s, force render
setTimeout(()=>{
  const app=document.getElementById('app');
  if(app && app.textContent.includes('Cargando')){
    S.checklist = S.checklist||loadChecklist();
    render();
    const d=document.createElement('div');
    d.style.cssText='position:fixed;top:0;left:0;right:0;background:var(--alert-soft);color:var(--alert);padding:8px;font-size:11px;z-index:9999;text-align:center';
    d.textContent='⚠️ Carga lenta de datos — funcionando en modo limitado';
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),5000);
  }
},10000);

(async()=>{
  S.checklist = loadChecklist();
  // Detect password recovery flow (link from reset email)
  sb.auth.onAuthStateChange((event, session)=>{
    if(event==='PASSWORD_RECOVERY' && session && session.user){
      onAuthenticated(session.user).then(()=>{
        UI.showPassModal=true; UI.newPass1=''; UI.newPass2='';
        render();
      });
    }
  });
  // Check existing session
  try {
    const {data:{session}} = await sb.auth.getSession();
    if(session && session.user){
      await onAuthenticated(session.user);
      return;
    }
  } catch(e){ console.warn('session check failed:', e); }
  render(); // shows login
})();
</script>
