  <style>
    :root{
      --bg:#FEFBF6; --paper:#FFFFFF; --ink:#2B2724; --ink-soft:#8A8479; --line:#EEE7D9;
      --jorge:#3B8FD9; --jorge-soft:#E7F2FC;
      --eva:#F2618A; --eva-soft:#FDEBF0;
      --ambos:#43B889; --ambos-soft:#E7F8F1;
      --alert:#E8734F; --alert-soft:#FCEEE7;
      --accent:#FFB238; --accent-soft:#FFF3DE;
    }
    body.dark{
      --bg:#211D1A; --paper:#2C2620; --ink:#F3EEE6; --ink-soft:#A69D8F; --line:#453D33;
      --jorge:#6FB3EE; --jorge-soft:#2B3F52;
      --eva:#F58AA8; --eva-soft:#4A2E38;
      --ambos:#6ED0A4; --ambos-soft:#213B30;
      --alert:#F2916C; --alert-soft:#4A2E22;
      --accent:#FFC966; --accent-soft:#4A3A1E;
    }
    body.dark .icon-badge{filter:saturate(1.15)}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,sans-serif;min-height:100vh;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
    .serif{font-family:'Fraunces',Georgia,serif;font-optical-sizing:auto}
    button{cursor:pointer;font-family:inherit}
    input,select,textarea{font-family:inherit}
    ::-webkit-scrollbar{width:4px;height:4px}
    ::-webkit-scrollbar-track{background:var(--bg)}
    ::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}

    /* Layout */
    #app{min-height:100vh;max-width:640px;margin:0 auto;background:var(--bg)}
    .header{background:var(--paper);border-bottom:1px solid var(--line);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
    .tab-bar{display:flex;background:var(--paper);border-bottom:1px solid var(--line);overflow-x:auto;padding:8px 10px 0;gap:5px}
    .tab-btn{padding:8px 11px 9px;border:1px solid transparent;background:var(--bg);color:var(--ink-soft);font-size:12.5px;font-weight:600;white-space:nowrap;border-radius:9px 9px 0 0;cursor:pointer;position:relative;top:1px}
    .tab-btn.active{background:var(--paper);color:var(--ink);border-color:var(--line);border-bottom-color:var(--paper)}
    .tab-btn[data-c="home"].active{box-shadow:inset 0 2px 0 var(--accent)}
    .tab-btn[data-c="cal"].active{box-shadow:inset 0 2px 0 var(--jorge)}
    .tab-btn[data-c="money"].active{box-shadow:inset 0 2px 0 var(--ambos)}
    .tab-btn[data-c="child"].active{box-shadow:inset 0 2px 0 var(--eva)}
    .tab-btn[data-c="agree"].active{box-shadow:inset 0 2px 0 var(--ink)}
    .tab-btn[data-c="exchange"].active{box-shadow:inset 0 2px 0 var(--alert)}
    .tab-btn[data-c="stats"].active{box-shadow:inset 0 2px 0 var(--jorge)}
    .content{padding:16px;max-width:720px;margin:0 auto}

    /* Cards */
    .card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
    .card-dark{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}

    /* Buttons */
    .btn-primary{background:var(--ink);color:var(--paper);border:none;border-radius:12px;padding:10px 18px;font-weight:600;font-size:13px;transition:opacity .15s}
    .btn-primary:hover{opacity:.88}
    .btn-ghost{background:var(--paper);color:var(--ink-soft);border:1px solid var(--line);border-radius:11px;padding:8px 14px;font-size:12px}
    .btn-danger{background:var(--alert-soft);color:var(--alert);border:none;border-radius:8px;padding:5px 10px;font-size:11px;font-weight:600}
    .btn-success{background:var(--ambos-soft);color:var(--ambos);border:none;border-radius:8px;padding:5px 10px;font-size:11px;font-weight:600}
    .btn-sm{background:var(--paper);border:1px solid var(--line);color:var(--ink-soft);border-radius:9px;padding:6px 12px;font-size:14px}

    /* Inputs */
    .input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:14px;outline:none;transition:border .15s}
    .input:focus{border-color:var(--jorge)}
    .label{display:block;font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px}

    /* Badges */
    .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
    .badge-J{background:var(--jorge-soft);color:var(--jorge)}
    .badge-E{background:var(--eva-soft);color:var(--eva)}
    .badge-ambos{background:var(--ambos-soft);color:var(--ambos)}
    .badge-warn{background:var(--alert-soft);color:var(--alert)}
    .badge-ok{background:var(--ambos-soft);color:var(--ambos)}

    /* Calendar */
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
    .cal-day-hdr{text-align:center;padding:8px 4px;font-size:10px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px}
    .cal-cell{min-height:40px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:default;transition:all .1s;position:relative}
    .cal-cell.has-event{cursor:pointer}
    .cal-cell.has-event:hover{filter:brightness(1.05)}
    .cal-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;font-family:'Fraunces',serif}
    .cal-num.today{background:var(--ink);color:var(--paper);font-weight:700}

    /* Dashboard widget — signature stamp element */
    .today-card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;position:relative;overflow:hidden;border-left:5px solid var(--jorge)}

    /* Alert banner */
    .alert-bar{background:var(--alert-soft);border-bottom:1px solid var(--alert);padding:8px 16px;display:flex;gap:8px;align-items:center;overflow-x:auto}
    .alert-pill{background:var(--paper);color:var(--alert);border:1px solid var(--alert);border-radius:20px;padding:3px 10px;font-size:11px;white-space:nowrap;font-weight:600}

    /* Toggle */
    .toggle-row{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;margin-bottom:14px}
    .toggle-btn{flex:1;padding:8px;border:none;border-radius:9px;font-size:12px;font-weight:600;color:var(--ink-soft);background:none;transition:all .15s}
    .toggle-btn.active{background:var(--paper);color:var(--ink)}

    /* Week view */
    .week-row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
    .week-cell{border-radius:11px;padding:8px 4px;text-align:center;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}

    /* Scrollable msg area */
    .msg-area{background:var(--bg);border:1px solid var(--line);border-radius:14px;height:320px;overflow-y:auto;padding:12px}
    .bubble-J{background:var(--jorge-soft);border-radius:14px 14px 4px 14px;padding:9px 13px;max-width:75%;color:var(--ink)}
    .bubble-E{background:var(--paper);border-radius:14px 14px 14px 4px;padding:9px 13px;max-width:75%;color:var(--ink);border:1px solid var(--line)}

    /* Animations */
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .fade-in{animation:fadeIn .2s ease}

    /* Icon badges — colored pastilles for tabs/nav, the playful touch */
    .icon-badge{width:24px;height:24px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;transition:transform .15s;flex-shrink:0}
    .tab-btn[data-c="home"] .icon-badge, .nav-item[data-c="home"] .icon-badge{color:var(--accent);background:var(--accent-soft)}
    .tab-btn[data-c="cal"] .icon-badge, .nav-item[data-c="cal"] .icon-badge{color:var(--jorge);background:var(--jorge-soft)}
    .tab-btn[data-c="money"] .icon-badge, .nav-item[data-c="money"] .icon-badge{color:var(--ambos);background:var(--ambos-soft)}
    .tab-btn[data-c="child"] .icon-badge, .nav-item[data-c="child"] .icon-badge{color:var(--eva);background:var(--eva-soft)}
    .tab-btn[data-c="agree"] .icon-badge, .nav-item[data-c="agree"] .icon-badge{color:var(--ink);background:var(--line)}
    .tab-btn[data-c="exchange"] .icon-badge, .nav-item[data-c="exchange"] .icon-badge{color:var(--alert);background:var(--alert-soft)}
    .tab-btn[data-c="stats"] .icon-badge, .nav-item[data-c="stats"] .icon-badge{color:var(--jorge);background:var(--jorge-soft)}
    .tab-btn.active .icon-badge, .nav-item.active .icon-badge{transform:scale(1.08)}

    /* Bottom nav — mobile only, hidden on desktop where the top tab-bar is used */
    .bottom-nav{
      position:sticky; bottom:0; background:var(--paper); border-top:1px solid var(--line);
      display:flex; padding:6px 4px calc(6px + env(safe-area-inset-bottom)); z-index:90;
    }
    .bottom-nav .nav-item{
      flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
      padding:5px 2px; font-size:9.5px; color:var(--ink-soft); background:none; border:none; cursor:pointer;
    }
    .bottom-nav .nav-item.active{color:var(--ink); font-weight:700}
    .bottom-nav .icon-badge{width:26px; height:26px; border-radius:9px}
    .bottom-nav svg{width:16px; height:16px}

    /* Responsive */
    @media(max-width:480px){.content{padding:10px 10px 84px}.card{padding:12px}.tab-bar{display:none}}
    @media(min-width:640px){
      .tab-bar{padding-left:16px;padding-right:16px}
    }
    @media(min-width:900px){
      body{padding:24px 0}
      #app{border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06),0 0 0 1px var(--line)}
      .bottom-nav{display:none}
      .tab-bar{display:flex}
      .content{padding-bottom:28px}
    }
  </style>

// ── Weekly schedule generator ─────────────────────────────────────────────────
// Pattern: week A = Jorge (L-D), week B = Eva (L-D), wednesday optional
function generateWeeklySchedule(startDate, weeksAhead=26, wednesdayMode='optional'){
  // startDate must be a Monday; startWith = 'J' or 'E'
  const events=[];
  let cur = new Date(startDate+'T12:00:00');
  let whoWeek = 'J'; // Jorge starts
  for(let w=0;w<weeksAhead;w++){
    const mon  = new Date(cur);
    const sun  = new Date(cur); sun.setDate(sun.getDate()+6);
    const wed  = new Date(cur); wed.setDate(wed.getDate()+2);
    const thu  = new Date(cur); thu.setDate(thu.getDate()+3);
    const monStr = mon.toISOString().slice(0,10);
    const sunStr = sun.toISOString().slice(0,10);
    const wedStr = wed.toISOString().slice(0,10);
    const thuStr = thu.toISOString().slice(0,10);
    const other  = whoWeek==='J'?'E':'J';

    if(wednesdayMode==='fixed_other'){
      // L-M con whoWeek, X con other, J-D con whoWeek
      events.push({from:monStr, to:addDays(monStr,1), who:whoWeek, note:'Turno semanal (L-M)', auto:true});
      events.push({from:wedStr, to:wedStr, who:other, note:'Miércoles fijo', auto:true});
      events.push({from:thuStr, to:sunStr, who:whoWeek, note:'Turno semanal (J-D)', auto:true});
    } else {
      // Semana completa
      events.push({from:monStr, to:sunStr, who:whoWeek, note:'Turno semanal', auto:true});
    }
    // Advance week
    cur.setDate(cur.getDate()+7);
    whoWeek = other;
  }
  return events;
}

let rtSubs = [];

// ── Data layer ────────────────────────────────────────────────────────────────
async function loadAll(){
  try {
    const [ev,ex,ag,ms,wl,ch] = await Promise.all([
      sb.from('events').select('*').order('from_date'),
      sb.from('expenses').select('*').order('date',{ascending:false}),
      sb.from('agreements').select('*').order('date',{ascending:false}),
      sb.from('messages').select('*').order('ts'),
      sb.from('wishlist').select('*').order('created_at'),
      sb.from('child_profile').select('*').limit(1).single(),
    ]);
    S.events    = (ev.data||[]).map(r=>({...r,from:r.from_date,to:r.to_date,changeRequest:r.change_request,changeStatus:r.change_status}));
    S.expenses  = (ex.data||[]).map(r=>({...r,desc:r.description,paidBy:r.paid_by,liquidatedAt:r.liquidated_at,receipt:r.receipt,cuentaComun:!!r.cuenta_comun,persona:r.persona||'Martina'}));
    S.agreements= ag.data||[];
    S.messages  = (ms.data||[]).map(r=>({...r,from:r.from_user}));
    S.wishlist  = (wl.data||[]).map(r=>({...r,requestedBy:r.requested_by,addedAt:r.added_at}));
    if(ch.data) S.child = ch.data;
  } catch(e){ console.error('loadAll core error:', e); }
  // Notes — optional, don't crash if table missing
  try {
    const nt = await sb.from('notes').select('*').order('created_at',{ascending:false});
    S.notes = nt.data||[];
  } catch(e){ S.notes=[]; console.warn('notes table not available'); }
  // Solicitudes — optional, don't crash if table missing
  try {
    const sol = await sb.from('solicitudes').select('*').order('created_at',{ascending:false});
    S.solicitudes = sol.data||[];
  } catch(e){ S.solicitudes=[]; console.warn('solicitudes table not available'); }
  // Eventos de agenda — optional, don't crash if table missing
  try {
    const evAg = await sb.from('eventos_agenda').select('*').order('fecha',{ascending:true});
    S.eventosAgenda = evAg.data||[];
  } catch(e){ S.eventosAgenda=[]; console.warn('eventos_agenda table not available'); }
}

function subscribeRT(){
  rtSubs.forEach(s=>sb.removeChannel(s));
  rtSubs=[];
  ['events','expenses','agreements','messages','wishlist','child_profile','notes','solicitudes','eventos_agenda'].forEach(t=>{
    const c=sb.channel('rt-'+t).on('postgres_changes',{event:'*',schema:'public',table:t},()=>loadAll().then(render)).subscribe();
    rtSubs.push(c);
  });
}

async function dbRespondSolicitud(id, estado){
  const s = S.solicitudes.find(x=>x.id===id);
  const resuelvePor = S.user.role;
  await sb.from('solicitudes').update({estado, resuelto_en:new Date().toISOString(), resuelto_por:resuelvePor}).eq('id',id);
  if(s){
    logActivity(estado==='aprobada'?'aprobó (consentimiento mutuo registrado)':'rechazó (SIN acuerdo)', 'solicitud', s.tipo_label+' — pedida por '+nameOf(s.from_user)+', resuelta por '+nameOf(resuelvePor));
    // Si es una solicitud de modificación/cancelación de periodo y se aprueba, aplicar el cambio real
    if(estado==='aprobada' && s.tipo==='modificar_periodo' && s.event_id_afectado){
      if(s.accion==='cancelar'){
        await sb.from('events').delete().eq('id', s.event_id_afectado);

        await sb.from('events').update({
          from_date: s.from_date, to_date: s.to_date,
          who: s.quien_nuevo || undefined,
          note: s.motivo,
        }).eq('id', s.event_id_afectado);
      }

    await notifyResolucionSolicitud(s, estado, resuelvePor);

// ── LOGIN ─────────────────────────────────────────────────────────────────────
function renderLogin(){
  const wrap=el('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',background:'var(--bg)'}});
  const box=el('div',{className:'card fade-in',style:{width:340,padding:32,margin:16}});
  const markLogin=el('div',{style:{display:'flex',justifyContent:'center',marginBottom:16}});
  markLogin.innerHTML='<svg width="52" height="52" viewBox="0 0 40 40" fill="none"><path d="M20 10c-7 0-11 5-11 10.5S13.5 30 19 30c3 0 5-1.5 5-4s-2-4-4.5-4" stroke="#3B8FD9" stroke-width="4.4" stroke-linecap="round"/><path d="M20 30c7 0 11-5 11-10.5S26.5 10 21 10c-3 0-5 1.5-5 4s2 4 4.5 4" stroke="#F2618A" stroke-width="4.4" stroke-linecap="round"/><circle cx="20" cy="20" r="3.2" fill="#FFB238"/></svg>';
  box.append(
    markLogin,
    el('div',{className:'serif',style:{fontWeight:600,fontSize:22,marginBottom:4,letterSpacing:-0.3,textAlign:'center'}},'Coparentalidad'),
    el('div',{style:{color:'var(--ink-soft)',fontSize:13,marginBottom:28,textAlign:'center'}},'Acceso privado · Jorge y Eva'),
  );

  const emailWrap=el('div',{style:{marginBottom:12}});
  emailWrap.appendChild(lbl('Email'));
  const emailInp=el('input',{type:'email',className:'input',placeholder:'tu@email.com',autocomplete:'email'});
  emailInp.value=UI.loginEmail||'';
  emailInp.addEventListener('input',e=>UI.loginEmail=e.target.value);
  emailWrap.appendChild(emailInp);

  const passWrap=el('div',{style:{marginBottom:20}});
  passWrap.appendChild(lbl('Contraseña'));
  const passInp=el('input',{type:'password',className:'input',placeholder:'••••••••',autocomplete:'current-password'});
  passInp.addEventListener('input',e=>UI.loginPass=e.target.value);
  passInp.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  passWrap.appendChild(passInp);

  const errDiv=el('div',{id:'loginErr',style:{color:'var(--alert)',fontSize:12,marginBottom:12,minHeight:16,textAlign:'center'}},UI.loginError||'');

  const loginBtn=el('button',{className:'btn-primary',style:{width:'100%',padding:13,fontSize:14},id:'loginBtn',onClick:doLogin},'Entrar');

  async function doLogin(){
    const btn=document.getElementById('loginBtn');
    const err=document.getElementById('loginErr');
    if(!UI.loginEmail||!UI.loginPass){ err.textContent='Introduce email y contraseña'; return; }
    btn.disabled=true; btn.textContent='Entrando…'; err.textContent='';
    try {
      const {data,error} = await sb.auth.signInWithPassword({email:UI.loginEmail.trim(),password:UI.loginPass});
      if(error){ err.textContent='Email o contraseña incorrectos'; btn.disabled=false; btn.textContent='Entrar'; return; }
      await onAuthenticated(data.user);
    } catch(e){
      err.textContent='Error de conexión. Inténtalo de nuevo.';
      btn.disabled=false; btn.textContent='Entrar';
    }
  }

  box.append(emailWrap,passWrap,errDiv,loginBtn);

  // Forgot password
  const forgotBtn=el('button',{style:{background:'none',border:'none',color:'var(--jorge)',fontSize:12,marginTop:14,width:'100%',textAlign:'center',cursor:'pointer',textDecoration:'underline'},onClick:async()=>{
    const err=document.getElementById('loginErr');
    if(!UI.loginEmail||!UI.loginEmail.includes('@')){ err.textContent='Escribe tu email arriba y vuelve a pulsar'; return; }
    err.style.color='var(--ink-soft)';
    err.textContent='Enviando…';
    try {
      const {error} = await sb.auth.resetPasswordForEmail(UI.loginEmail.trim(), {redirectTo: window.location.origin + window.location.pathname});
      if(error){ err.style.color='var(--alert)'; err.textContent='No se pudo enviar. Revisa el email.'; return; }
      err.style.color='var(--ambos)';
      err.textContent='✓ Revisa tu correo. Te llegará un enlace para crear una contraseña nueva.';
    } catch(e){ err.style.color='var(--alert)'; err.textContent='Error de conexión.'; }
  }},'He olvidado mi contraseña');
  box.appendChild(forgotBtn);

  box.appendChild(el('div',{style:{fontSize:11,color:'var(--ink-soft)',marginTop:16,textAlign:'center',lineHeight:1.5}},'Cada usuario accede con su propia cuenta verificada. Los mensajes quedan ligados a la identidad real y no pueden editarse ni borrarse.'));
  wrap.appendChild(box);
  return wrap;
}

async function onAuthenticated(authUser){
  // Fetch role from profiles
  const {data:prof} = await sb.from('profiles').select('*').eq('id',authUser.id).single();
  if(!prof){
    alert('Tu usuario no tiene perfil asignado. Contacta con el administrador.');
    await sb.auth.signOut();
    return;
  }
  S.user = {role:prof.role, name:prof.name, email:authUser.email, uid:authUser.id};
  UI.loginPass='';
  await loadAll();
  render();
  subscribeRT();
  try{ await checkAndSendUpcomingReminders(); }catch(e){}
}

// ── SHELL ─────────────────────────────────────────────────────────────────────
function renderShell(){
  const wrap=el('div',{});

  // Balance
  const pend=S.expenses.filter(e=>e.status==='pendiente');
  const bal={J:0,E:0};
  pend.forEach(e=>{
    if(e.cuentaComun) return; // pagado con cargo a la cuenta común, no genera deuda entre progenitores
    const a=parseFloat(e.amount||0);
    if(e.split==='50-50'){const h=a/2;if(e.paidBy==='J')bal.E+=h;else bal.J+=h;}
    else if(e.split==='100% Jorge'){if(e.paidBy==='E')bal.J+=a;}
    else if(e.split==='100% Eva'){if(e.paidBy==='J')bal.E+=a;}
  });
  const diff=bal.E-bal.J;

  // Alerts
  const alerts=[];
  S.expenses.filter(e=>e.status==='pendiente').forEach(e=>{const age=Math.round((Date.now()-new Date(e.date+'T12:00:00'))/86400000);if(age>=14)alerts.push('"'+e.desc+'" — '+age+'d pendiente');});
  const custodyOn = ds => { const e=S.events.find(ev=>ev.from<=ds&&ev.to>=ds&&ev.changeStatus!=='rechazado'); return e?e.who:null; };
  S.events.forEach(ev=>{
    if(ev.changeStatus==='rechazado') return;
    const d=daysUntil(ev.from);
    if(d>=0&&d<=2&&custodyOn(addDays(ev.from,-1))!==ev.who) alerts.push('Cambio de custodia '+(d===0?'HOY':'en '+d+'d')+' → '+nameOf(ev.who));
  });
  S.events.filter(ev=>ev.changeStatus==='pendiente').forEach(()=>alerts.push('Solicitud de cambio pendiente de confirmar'));
  S.solicitudes.filter(s=>s.estado==='pendiente'&&s.from_user!==S.user.role).forEach(s=>{
    const tipoInfo=SOLICITUD_TIPOS.find(t=>t.id===s.tipo);
    alerts.push('📋 '+nameOf(s.from_user)+' pide: '+(tipoInfo?tipoInfo.label:s.tipo));
  });

  // Header
  const hdr=el('div',{className:'header'});
  const hL=el('div',{style:{display:'flex',alignItems:'center',gap:12}});
  const markMain=el('span',{});
  markMain.innerHTML='<svg width="30" height="30" viewBox="0 0 40 40" fill="none"><path d="M20 10c-7 0-11 5-11 10.5S13.5 30 19 30c3 0 5-1.5 5-4s-2-4-4.5-4" stroke="#3B8FD9" stroke-width="4.4" stroke-linecap="round"/><path d="M20 30c7 0 11-5 11-10.5S26.5 10 21 10c-3 0-5 1.5-5 4s2 4 4.5 4" stroke="#F2618A" stroke-width="4.4" stroke-linecap="round"/><circle cx="20" cy="20" r="3.2" fill="#FFB238"/></svg>';
  hL.append(markMain,el('div',{}));
  hL.children[1].append(
    el('div',{className:'serif',style:{fontWeight:600,fontSize:15,letterSpacing:-0.2}},'Coparentalidad'),
    el('div',{style:{color:'var(--ink-soft)',fontSize:11}},'Usuario: '+S.user.name)
  );
  const hR=el('div',{style:{display:'flex',gap:8,alignItems:'center'}});
  if(Math.abs(diff)>0.01) hR.appendChild(badge(diff>0?'Eva debe '+fmtM(diff):'Jorge debe '+fmtM(Math.abs(diff)),'badge-warn'));
  hR.append(
    el('button',{className:'btn-ghost',style:{fontSize:13,padding:'6px 10px'},onClick:()=>{UI.searchOpen=!UI.searchOpen;UI.searchQuery='';render();}},iconEl('search')),
    el('button',{className:'btn-ghost',style:{fontSize:13,padding:'6px 10px'},onClick:toggleTheme},iconEl(UI.theme==='dark'?'sun':'moon')),
    el('button',{className:'btn-ghost',style:{fontSize:11,display:'flex',alignItems:'center',gap:5},onClick:exportPDF},[iconEl('pdf',14),'PDF']),
    el('button',{className:'btn-ghost',style:{fontSize:13,padding:'6px 10px'},title:'Cambiar contraseña',onClick:()=>{UI.showPassModal=true;UI.newPass1='';UI.newPass2='';render();}},'🔑'),
    el('button',{className:'btn-ghost',style:{fontSize:11,padding:'6px 10px'},onClick:async()=>{await sb.auth.signOut();S.user=null;rtSubs.forEach(s=>sb.removeChannel(s));render();}},'Salir')
  );
  hdr.append(hL,hR);

  // Alert bar
  let alertEl=null;
  if(alerts.length){
    alertEl=el('div',{className:'alert-bar'});
    alertEl.appendChild(el('span',{style:{fontSize:14,flexShrink:0}},'⚠️'));
    const aw=el('div',{style:{display:'flex',gap:8,overflowX:'auto'}});
    alerts.forEach(a=>aw.appendChild(el('span',{className:'alert-pill'},a)));
    alertEl.appendChild(aw);
  }

  // Tabs
  // TABS definido junto a su render, más abajo
  const tabBar=el('div',{className:'tab-bar'});
  const TABS=[
    {label:'Inicio', icon:ICONS.home, c:'home'},
    {label:'Calendario', icon:ICONS.calendar, c:'cal'},
    {label:'Gastos', icon:ICONS.euro, c:'money'},
    {label:'Ficha', icon:ICONS.child, c:'child'},
    {label:'Acuerdos', icon:ICONS.doc, c:'agree'},
    {label:'Intercambio', icon:ICONS.swap, c:'exchange'},
    {label:'Stats', icon:ICONS.chart, c:'stats'},
  ];
  TABS.forEach((t,i)=>{
    const btn=el('button',{className:'tab-btn'+(S.tab===i?' active':''),onClick:()=>{S.tab=i;render();}});
    btn.setAttribute('data-c', t.c);
    const badge=el('span',{className:'icon-badge'});
    badge.innerHTML=t.icon;
    btn.append(badge, document.createTextNode(t.label));
    tabBar.appendChild(btn);
  });

  // Search overlay
  let searchEl=null;
  if(UI.searchOpen){
    searchEl=el('div',{style:{background:'var(--bg,var(--bg))',borderBottom:'1px solid var(--line)',padding:'12px 16px'}});
    const si=el('input',{className:'input',placeholder:'Buscar en gastos, acuerdos, mensajes…',style:{marginBottom:UI.searchQuery?12:0}});
    si.value=UI.searchQuery;
    si.addEventListener('input',e=>{UI.searchQuery=e.target.value;render();});
    setTimeout(()=>si.focus(),50);
    searchEl.appendChild(si);
    if(UI.searchQuery.trim().length>1){
      const q=UI.searchQuery.toLowerCase();
      const results=[];
      S.expenses.filter(e=>e.desc?.toLowerCase().includes(q)||e.cat?.toLowerCase().includes(q)||e.note?.toLowerCase().includes(q)).forEach(e=>results.push({type:'💶 Gasto',title:e.desc,sub:fmtM(e.amount)+' · '+fmt(e.date),onClick:()=>{S.tab=2;UI.searchOpen=false;render();}}));
      S.agreements.filter(a=>a.title?.toLowerCase().includes(q)||a.detail?.toLowerCase().includes(q)||a.category?.toLowerCase().includes(q)).forEach(a=>results.push({type:'📝 Acuerdo',title:a.title,sub:a.category+' · '+fmt(a.date),onClick:()=>{S.tab=4;UI.searchOpen=false;render();}}));
      S.messages.filter(m=>m.text?.toLowerCase().includes(q)).forEach(m=>results.push({type:'💬 Mensaje',title:m.text.slice(0,60)+(m.text.length>60?'…':''),sub:nameOf(m.from)+' · '+new Date(m.ts).toLocaleDateString('es-ES'),onClick:()=>{S.tab=4;UI.agSubTab=1;UI.searchOpen=false;render();}}));
      S.events.filter(ev=>ev.note?.toLowerCase().includes(q)).forEach(ev=>results.push({type:'📅 Custodia',title:ev.note,sub:nameOf(ev.who)+' · '+fmt(ev.from)+'→'+fmt(ev.to),onClick:()=>{S.tab=1;UI.searchOpen=false;render();}}));
      if(!results.length){
        searchEl.appendChild(el('div',{style:{color:'var(--ink-soft)',fontSize:13,padding:'8px 0'}},'Sin resultados'));
      } else {
        const rl=el('div',{style:{maxHeight:260,overflowY:'auto'}});
        results.slice(0,12).forEach(r=>{
          const row=el('div',{style:{display:'flex',gap:10,padding:'9px 0',borderBottom:'1px solid var(--paper)',cursor:'pointer',alignItems:'start'},onClick:r.onClick});
          row.append(
            el('span',{style:{fontSize:10,background:'var(--paper)',borderRadius:6,padding:'3px 7px',flexShrink:0,color:'var(--ink-soft)',whiteSpace:'nowrap'}},r.type),
            el('div',{},[el('div',{style:{fontSize:13,fontWeight:600,marginBottom:2}},r.title),el('div',{style:{fontSize:11,color:'var(--ink-soft)'}},r.sub)])
          );
          rl.appendChild(row);
        });
        if(results.length>12) rl.appendChild(el('div',{style:{fontSize:11,color:'var(--ink-soft)',padding:'6px 0'}},'+'+(results.length-12)+' más'));
        searchEl.appendChild(rl);
      }
    }
  }

  // Weekly summary banner
  const mon=new Date(); mon.setHours(12,0,0,0);
  const dow=mon.getDay(); const diff2=dow===0?-6:1-dow;
  mon.setDate(mon.getDate()+diff2);
  const monStr=mon.toISOString().slice(0,10);
  let summaryEl=null;
  if(dow>=1 && UI.summaryDismissed!==monStr){
    const prevMon=addDays(monStr,-7);
    const prevSun=addDays(monStr,-1);
    const weekExp=S.expenses.filter(e=>e.date>=prevMon&&e.date<=prevSun);
    const weekEvs=S.events.filter(ev=>ev.from>=prevMon&&ev.from<=prevSun&&ev.changeStatus!=='rechazado');
    const weekTotal=weekExp.reduce((s,e)=>s+parseFloat(e.amount||0),0);
    const weekPend=weekExp.filter(e=>e.status==='pendiente').reduce((s,e)=>s+parseFloat(e.amount||0),0);
    if(weekExp.length>0||weekEvs.length>0){
      summaryEl=el('div',{style:{background:'var(--jorge-soft)',borderBottom:'1px solid var(--jorge)',padding:'10px 16px',display:'flex',justifyContent:'space-between',alignItems:'center',gap:12}});
      const txt=el('div',{});
      txt.appendChild(el('div',{style:{fontSize:12,fontWeight:700,color:'var(--jorge)',marginBottom:3}},'📋 Resumen semana anterior'));
      const parts=[];
      if(weekExp.length) parts.push(weekExp.length+' gastos ('+fmtM(weekTotal)+(weekPend>0?' · '+fmtM(weekPend)+' pendiente':'')+')');
      if(weekEvs.length) parts.push(weekEvs.length+' cambio'+(weekEvs.length>1?'s':'')+' de custodia');
      txt.appendChild(el('div',{style:{fontSize:11,color:'var(--jorge)'}},parts.join(' · ')));
      const closeBtn=el('button',{style:{background:'none',border:'none',color:'var(--ink-soft)',fontSize:16,cursor:'pointer',flexShrink:0},onClick:()=>{UI.summaryDismissed=monStr;localStorage.setItem('cp:summaryDismissed',monStr);render();}},'✕');
      summaryEl.append(txt,closeBtn);
    }
  }

  const content=el('div',{className:'content fade-in'});
  if(S.tab===0) content.appendChild(renderDashboard(diff));
  if(S.tab===1) content.appendChild(renderCustodia());
  if(S.tab===2) content.appendChild(renderGastos(diff));
  if(S.tab===3) content.appendChild(renderFicha());
  if(S.tab===4) content.appendChild(renderAcuerdos());
  if(S.tab===5) content.appendChild(renderIntercambio());
  if(S.tab===6) content.appendChild(renderStats());

  wrap.append(hdr);
  if(alertEl) wrap.append(alertEl);
  if(summaryEl) wrap.append(summaryEl);
  if(searchEl) wrap.append(searchEl);
  wrap.append(tabBar,content);

  // Barra de navegación inferior — solo visible en móvil (ver CSS .bottom-nav)
  const bottomNav=el('div',{className:'bottom-nav'});
  TABS.forEach((t,i)=>{
    const item=el('button',{className:'nav-item'+(S.tab===i?' active':''),onClick:()=>{S.tab=i;render();}});
    item.setAttribute('data-c', t.c);
    const badge=el('span',{className:'icon-badge'});
    badge.innerHTML=t.icon;
    const labelSpan=el('span',{},t.label);
    item.append(badge, labelSpan);
    bottomNav.appendChild(item);
  });
  wrap.append(bottomNav);

  // Password change modal
  if(UI.showPassModal){
    const overlay=el('div',{style:{position:'fixed',top:0,left:0,right:0,bottom:0,background:'rgba(0,0,0,.7)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:16},onClick:e=>{if(e.target===e.currentTarget){UI.showPassModal=false;render();}}});
    const modal=el('div',{className:'card',style:{width:320,padding:24}});
    modal.appendChild(el('div',{style:{fontWeight:700,fontSize:16,marginBottom:6}},'🔑 Cambiar contraseña'));
    modal.appendChild(el('div',{style:{fontSize:12,color:'var(--ink-soft)',marginBottom:16}},'Cuenta: '+(S.user.email||'')));

    const p1Wrap=el('div',{style:{marginBottom:10}});
    p1Wrap.appendChild(lbl('Nueva contraseña'));
    const p1=el('input',{type:'password',className:'input',placeholder:'Mínimo 6 caracteres',autocomplete:'new-password'});
    p1.addEventListener('input',e=>UI.newPass1=e.target.value);
    p1Wrap.appendChild(p1);

    const p2Wrap=el('div',{style:{marginBottom:14}});
    p2Wrap.appendChild(lbl('Repite la contraseña'));
    const p2=el('input',{type:'password',className:'input',placeholder:'••••••••',autocomplete:'new-password'});
    p2.addEventListener('input',e=>UI.newPass2=e.target.value);
    p2Wrap.appendChild(p2);

    const errP=el('div',{id:'passErr',style:{fontSize:12,minHeight:16,marginBottom:10,textAlign:'center',color:'var(--alert)'}},'');

    const saveP=el('button',{className:'btn-primary',style:{width:'100%'},id:'passBtn',onClick:async()=>{
      const err=document.getElementById('passErr');
      const btn=document.getElementById('passBtn');
      if(!UI.newPass1||UI.newPass1.length<6){ err.textContent='Mínimo 6 caracteres'; return; }
      if(UI.newPass1!==UI.newPass2){ err.textContent='Las contraseñas no coinciden'; return; }
      btn.disabled=true; btn.textContent='Guardando…'; err.textContent='';
      try {
        const {error} = await sb.auth.updateUser({password:UI.newPass1});
        if(error){ err.textContent='Error: '+error.message; btn.disabled=false; btn.textContent='Cambiar contraseña'; return; }
        err.style.color='var(--ambos)';
        err.textContent='✓ Contraseña cambiada correctamente';
        setTimeout(()=>{UI.showPassModal=false;render();},1500);
      } catch(e){ err.textContent='Error de conexión'; btn.disabled=false; btn.textContent='Cambiar contraseña'; }
    }},'Cambiar contraseña');

    const cancelP=el('button',{className:'btn-ghost',style:{width:'100%',marginTop:8},onClick:()=>{UI.showPassModal=false;render();}},'Cancelar');

    modal.append(p1Wrap,p2Wrap,errP,saveP,cancelP);
    overlay.appendChild(modal);
    wrap.appendChild(overlay);
  }

  return wrap;
}

// ── DASHBOARD ─────────────────────────────────────────────────────────────────
function renderDashboard(diff){
  const wrap=el('div',{});
  const todayStr=today();

  // Who has Martina today
  const todayEv=S.events.find(ev=>ev.from<=todayStr&&ev.to>=todayStr&&ev.changeStatus!=='rechazado');
  const nextEv=[...S.events].filter(ev=>ev.from>todayStr&&ev.changeStatus!=='rechazado').sort((a,b)=>a.from.localeCompare(b.from))[0];

  // Today card
  const tc=el('div',{className:'today-card'});
  tc.append(titleIcon('clock','Hoy · '+new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}),{fontSize:11,color:'var(--ink-soft)',marginBottom:8,textTransform:'uppercase',letterSpacing:0.5}));
  if(todayEv){
    tc.append(
      el('div',{style:{fontWeight:800,fontSize:22,marginBottom:4,color:CUSTODY_TEXT[todayEv.who]}}, (S.child.name||'Martina')+' está con '+nameOf(todayEv.who)),
      el('div',{style:{fontSize:13,color:'var(--ink-soft)'}},'hasta el '+(fmt(todayEv.to))+(todayEv.note?' · '+todayEv.note:'')+'')
    );
  } else {
    tc.appendChild(el('div',{style:{fontWeight:700,fontSize:18,color:'var(--ink-soft)'}},'Sin custodia registrada hoy'));
  }
  if(nextEv){
    tc.append(el('div',{style:{marginTop:12,paddingTop:12,borderTop:'1px solid rgba(255,255,255,.1)',fontSize:12,color:'var(--ink-soft)'}},[
      el('span',{},'Próximo cambio: '),
      el('span',{style:{color:CUSTODY_TEXT[nextEv.who],fontWeight:600}},nameOf(nextEv.who)),
      el('span',{},' el '+(fmt(nextEv.from))+' ('+(daysUntil(nextEv.from)===0?'hoy':daysUntil(nextEv.from)===1?'mañana':'en '+daysUntil(nextEv.from)+'d')+')')
    ]));
  }
  wrap.appendChild(tc);

  // Stats row
  const pend=S.expenses.filter(e=>e.status==='pendiente');
  const stats=el('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:16}});
  [
    [S.events.filter(e=>e.from>=todayStr).length,'Periodos futuros'],
    [pend.length,'Gastos pendientes'],
    [S.agreements.filter(a=>a.status==='activo').length,'Acuerdos'],
  ].forEach(([v,l])=>{
    const s=el('div',{className:'card',style:{textAlign:'center',padding:'14px 10px'}});
    s.append(el('div',{className:'serif',style:{fontWeight:700,fontSize:22,marginBottom:2}},String(v)),el('div',{style:{fontSize:11,color:'var(--ink-soft)'}},l));
    stats.appendChild(s);
  });
  wrap.appendChild(stats);

  // Balance card
  if(Math.abs(diff)>0.01){
    const bc=el('div',{className:'card',style:{borderColor:'var(--alert)',background:'var(--alert-soft)',marginBottom:12}});
    bc.append(
      titleIcon('wallet','Saldo pendiente',{fontSize:11,color:'var(--alert)',marginBottom:6,textTransform:'uppercase',letterSpacing:.5}),
      el('div',{style:{fontWeight:800,fontSize:20,color:'var(--alert)'}},diff>0?'Eva debe '+(fmtM(Math.abs(diff)))+'':'Jorge debe '+(fmtM(Math.abs(diff)))+''),
      el('div',{style:{fontSize:12,color:'var(--ink-soft)',marginTop:4}}, pend.length+' gastos · '+(fmtM(pend.reduce((s,e)=>s+parseFloat(e.amount||0),0)))+'')
    );
    wrap.appendChild(bc);
  }

  // Recent messages
  if(S.messages.length>0){
    const rc=el('div',{className:'card'});
    rc.appendChild(titleIcon('message','Últimos mensajes',{fontWeight:700,color:'var(--ink-soft)',textTransform:'uppercase',fontSize:11,letterSpacing:.5,marginBottom:10}));
    [...S.messages].slice(-3).forEach(m=>{
      const r=el('div',{style:{display:'flex',gap:8,marginBottom:8,alignItems:'start'}});
      r.append(badge(nameOf(m.from),'badge-'+(m.from==='J'?'J':'E')),el('div',{style:{fontSize:13,color:'var(--ink-soft)',flex:1}},m.text));
      rc.appendChild(r);
    });
    const viewAll=el('button',{className:'btn-ghost',style:{width:'100%',marginTop:4,fontSize:11},onClick:()=>{S.tab=4;UI.agSubTab=1;render();}},'Ver todos →');
    rc.appendChild(viewAll);
    wrap.appendChild(rc);
  }

  // Quick notes
  const NOTE_COLORS = {
    yellow:{bg:'var(--accent-soft)',border:'var(--accent)',text:'var(--ink)',dot:'var(--accent)'},
    blue:  {bg:'var(--jorge-soft)',border:'var(--jorge)',text:'var(--ink)',dot:'var(--jorge)'},
    green: {bg:'var(--ambos-soft)',border:'var(--ambos)',text:'var(--ink)',dot:'var(--ambos)'},
    red:   {bg:'var(--alert-soft)',border:'var(--alert)',text:'var(--ink)',dot:'var(--alert)'},
  };
  const nc=el('div',{className:'card',style:{marginBottom:12}});
  const nh=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}});
  nh.append(
    titleIcon('pin','Notas rápidas',{fontWeight:700,fontSize:14}),
    el('div',{style:{fontSize:11,color:'var(--ink-soft)'}},'Visibles para ambos')
  );
  nc.appendChild(nh);

  // Existing notes
  if(S.notes.length>0){
    const noteList=el('div',{style:{display:'flex',flexDirection:'column',gap:8,marginBottom:10}});
    [...S.notes].slice(0,5).forEach(n=>{
      const c=NOTE_COLORS[n.color]||NOTE_COLORS.yellow;
      const nr=el('div',{style:{background:c.bg,border:'1px solid '+c.border+'22',borderLeft:'3px solid '+c.border,borderRadius:10,padding:'9px 12px',display:'flex',justifyContent:'space-between',alignItems:'start',gap:8}});
      const ni=el('div',{style:{flex:1}});
      ni.append(
        el('div',{style:{fontSize:13,color:c.text,lineHeight:1.4}},n.text),
        el('div',{style:{fontSize:10,color:c.border+'99',marginTop:4}},(n.from_user==='J'?'Jorge':'Eva')+' · '+new Date(n.created_at).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}))
      );
      const delBtn=el('button',{style:{background:'none',border:'none',color:c.border+'66',fontSize:13,cursor:'pointer',flexShrink:0},onClick:()=>dbDelNote(n.id)},'✕');
      nr.append(ni,delBtn);
      noteList.appendChild(nr);
    });
    nc.appendChild(noteList);
    if(S.notes.length>5) nc.appendChild(el('div',{style:{fontSize:11,color:'var(--ink-soft)',marginBottom:8}},'+'+(S.notes.length-5)+' notas más'));
  } else {
    nc.appendChild(el('div',{style:{color:'var(--ink-soft)',fontSize:12,marginBottom:10,fontStyle:'italic'}},'Sin notas. Añade un recordatorio rápido para ambos…'));
  }

  // Add note form
  const nForm=el('div',{style:{display:'flex',gap:6,alignItems:'start',flexWrap:'wrap'}});
  const nInp=el('textarea',{className:'input',style:{flex:'1 1 200px',minHeight:38,resize:'none',lineHeight:1.4,fontSize:13}});
  nInp.placeholder='Escribe una nota rápida…';
  nInp.value=UI.noteText||'';
  nInp.addEventListener('input',e=>UI.noteText=e.target.value);
  nInp.addEventListener('keydown',async e=>{
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(UI.noteText.trim()){await dbAddNote(UI.noteText.trim(),UI.noteColor);UI.noteText='';}}
  });

  // Color picker
  const colorPick=el('div',{style:{display:'flex',gap:4,alignItems:'center',flexShrink:0}});
  Object.entries(NOTE_COLORS).forEach(([k,c])=>{
    colorPick.appendChild(el('button',{
      style:{width:18,height:18,borderRadius:'50%',background:c.dot,border:UI.noteColor===k?'2px solid #fff':'2px solid transparent',cursor:'pointer'},
      onClick:()=>{UI.noteColor=k;render();}
    },''));
  });

  const nBtn=el('button',{className:'btn-primary',style:{padding:'8px 12px',fontSize:12,flexShrink:0},onClick:async()=>{
    if(UI.noteText.trim()){await dbAddNote(UI.noteText.trim(),UI.noteColor);UI.noteText='';}
  }},'Añadir');
  nForm.append(nInp,el('div',{style:{display:'flex',flexDirection:'column',gap:6}},[colorPick,nBtn]));
  nc.appendChild(nForm);
  wrap.appendChild(nc);

  return wrap;
}

// ── CUSTODIA ──────────────────────────────────────────────────────────────────
function renderCustodia(){
  const wrap=el('div',{});

  // View toggle
  const tgl=el('div',{className:'toggle-row'});
  [['month','Mes'],['week','Semana']].forEach(([v,l])=>{
    tgl.appendChild(el('button',{className:'toggle-btn'+(UI.calView===v?' active':''),onClick:()=>{UI.calView=v;render();}},l));
  });
  wrap.appendChild(tgl);

  if(UI.calView==='month') wrap.appendChild(renderCalMonth());
  else wrap.appendChild(renderCalWeek());

  // Selected event detail
  if(UI.calSelected){
    const s=UI.calSelected;
    const sc=el('div',{className:'card fade-in',style:{borderLeft:'3px solid '+(CUSTODY_TEXT[s.who])+'',marginBottom:12}});
    const top=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'start'}});
    const info=el('div',{style:{flex:1}});
    info.append(
      el('div',{style:{fontWeight:700,fontSize:14,color:CUSTODY_TEXT[s.who],marginBottom:4}},nameOf(s.who)+': '+fmt(s.from)+' → '+fmt(s.to)+' · '+(daysBetween(s.from,s.to))+'d'),
    );
    if(s.note) info.appendChild(el('div',{style:{fontSize:12,color:'var(--ink-soft)',marginBottom:4}},s.note));
    if(s.changeStatus==='pendiente') info.appendChild(el('div',{style:{background:'var(--alert-soft)',color:'var(--alert)',borderRadius:8,padding:'5px 10px',fontSize:11,marginBottom:6}},'⏳ Solicitud pendiente de confirmar'));
    const btns=el('div',{style:{display:'flex',gap:6,flexShrink:0,flexWrap:'wrap',justifyContent:'flex-end'}});
    btns.appendChild(el('button',{className:'btn-ghost',style:{fontSize:11,padding:'5px 8px',background:'var(--eva-soft)',color:'var(--eva)'},onClick:()=>{
      UI.showSolicitudForm=true;UI.solicitudTipo='modificar_periodo';
      UI.solicitudForm={
        from:s.from, to:s.to, motivo:'',
        eventIdAfectado:s.id, accion:'editar', quienNuevo:s.who,
        aiText:'', aiLoading:false
      };
      UI.calSelected=null;render();
      setTimeout(()=>{const el2=document.querySelector('.content');if(el2)el2.scrollIntoView({behavior:'smooth',block:'start'});},100);
    }},'📋 Solicitar cambio de este periodo'));
    btns.appendChild(el('button',{className:'btn-ghost',style:{fontSize:11,padding:'5px 8px'},onClick:()=>{UI.calSelected=null;render();}},'Cerrar'));
    top.append(info,btns);sc.appendChild(top);wrap.appendChild(sc);
  }

  // Eventos de agenda seleccionados desde el calendario
  if(UI.calSelectedEventos && UI.calSelectedEventos.length){
    UI.calSelectedEventos.forEach(ev=>{
      const tipoInfo=EVENTO_TIPOS.find(t=>t.id===ev.tipo)||EVENTO_TIPOS[EVENTO_TIPOS.length-1];

    className:'btn-primary',style:{width:'100%',marginBottom:8,padding:13,background:'var(--eva)'},
    onClick:()=>{UI.showSolicitudForm=!UI.showSolicitudForm;UI.solicitudTipo=null;UI.showWeekGen=false;UI.showEventoForm=false;render();}
  },UI.showSolicitudForm?'Cancelar':'📋 Solicitar cambio, ausencia o vacaciones'));

  // Listado de solicitudes pendientes/recientes
  if(S.solicitudes.length>0) wrap.appendChild(renderSolicitudesList());

  // Generador de turnos base (solo para precargar el calendario, no para cambios puntuales)

  if(UI.showEventoForm) wrap.appendChild(renderEventoAgendaForm());

  // Próximos eventos de agenda
  const proximosEventos=[...S.eventosAgenda].filter(e=>e.fecha>=today()).sort((a,b)=>a.fecha.localeCompare(b.fecha)).slice(0,6);
  if(proximosEventos.length){
    wrap.appendChild(titleIcon('party','Próximos eventos',{fontSize:11,fontWeight:700,color:'var(--ink-soft)',marginBottom:8,textTransform:'uppercase',letterSpacing:.5}));

      const tipoInfo=EVENTO_TIPOS.find(t=>t.id===ev.tipo)||EVENTO_TIPOS[EVENTO_TIPOS.length-1];
      const r=el('div',{className:'card',style:{marginBottom:8,padding:'10px 14px',borderLeft:'3px solid '+tipoInfo.color}});
      const t=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}});
      t.append(
        el('div',{style:{fontSize:13}},tipoInfo.icono+' '+ev.titulo),
        el('div',{style:{fontSize:11,color:'var(--ink-soft)'}},fmt(ev.fecha)+(ev.hora?' · '+ev.hora:''))
      );
      r.appendChild(t);
      if(ev.detalle) r.appendChild(el('div',{style:{fontSize:11,color:'var(--ink-soft)',marginTop:4}},ev.detalle));
      const delBtn=el('button',{style:{fontSize:10,background:'none',border:'none',color:'var(--ink-soft)',cursor:'pointer',marginTop:6,padding:0},onClick:()=>dbDelEventoAgenda(ev.id)},'Borrar');
      r.appendChild(delBtn);
      wrap.appendChild(r);
    });
  }

  // Upcoming events
  const upcoming=[...S.events].filter(ev=>ev.to>=today()&&ev.changeStatus!=='rechazado').sort((a,b)=>a.from.localeCompare(b.from)).slice(0,8);
  if(upcoming.length){
    wrap.appendChild(el('div',{style:{fontSize:11,fontWeight:700,color:'var(--ink-soft)',marginBottom:8,textTransform:'uppercase',letterSpacing:.5}},'Próximos periodos'));
    upcoming.forEach(ev=>{
      const r=el('div',{className:'card',style:{marginBottom:8,cursor:'pointer',borderLeft:'3px solid '+(ev.changeStatus==='pendiente'?'var(--ink-soft)':CUSTODY_TEXT[ev.who]),padding:'12px 14px'},onClick:()=>{UI.calSelected=ev;render();}});
      const t=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}});
      t.append(
        el('div',{style:{display:'flex',gap:8,alignItems:'center'}},[badge(nameOf(ev.who),'badge-'+ev.who),ev.changeStatus==='pendiente'?badge('Pendiente','badge-warn'):badge('Confirmado','badge-ok')]),
        el('div',{style:{fontSize:12,color:'var(--ink-soft)'}},fmt(ev.from)+' → '+fmt(ev.to)+' · '+(daysBetween(ev.from,ev.to))+'d')
      );
      r.appendChild(t);
      if(ev.note) r.appendChild(el('div',{style:{fontSize:11,color:'var(--ink-soft)',marginTop:3}},ev.note));
      wrap.appendChild(r);
    });
  }

  return wrap;
}

function renderCalMonth(){
  const wrap=el('div',{});
  const nav=el('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}});
  nav.append(
    el('button',{className:'btn-sm',onClick:()=>{if(UI.calMonth===0){UI.calMonth=11;UI.calYear--;}else UI.calMonth--;render();}},'←'),
    el('span',{style:{fontWeight:700,fontSize:15}},MONTHS_L[UI.calMonth]+' '+(UI.calYear)+''),
    el('button',{className:'btn-sm',onClick:()=>{if(UI.calMonth===11){UI.calMonth=0;UI.calYear++;}else UI.calMonth++;render();}},'→')
  );

  // Legend
  const leg=el('div',{style:{display:'flex',gap:'8px 12px',marginBottom:12,flexWrap:'wrap',alignItems:'center'}});
  [['J','Jorge','var(--jorge)'],['E','Eva','var(--eva)'],['ambos','Ambos','var(--ambos)'],['wed','Miérc.','var(--alert)'],['fest','Festivo','var(--accent)']].forEach(([k,l,color])=>{
    const d=el('div',{style:{display:'flex',alignItems:'center',gap:5,flexShrink:0}});
    d.append(
      el('div',{style:{width:10,height:10,borderRadius:3,background:k==='wed'?'var(--alert-soft)':k==='fest'?'var(--accent-soft)':color,border:k==='wed'?'1px dashed var(--alert)':k==='fest'?'1px solid var(--accent)':'none',flexShrink:0}}),
      el('span',{style:{fontSize:10.5,color:'var(--ink-soft)',whiteSpace:'nowrap'}},l)
    );
    leg.appendChild(d);
  });

  // Build day map — miércoles fijo gets special treatment
  const dayMap={};
  const wedMap={};
  S.events.forEach(ev=>{
    if(ev.changeStatus==='rechazado') return;
    if(ev.note==='Miércoles fijo'&&ev.from===ev.to){
      wedMap[ev.from]=ev; return;
    }
    let d=new Date(ev.from+'T12:00:00'),end=new Date(ev.to+'T12:00:00');
    while(d<=end){
      const k=d.toISOString().slice(0,10);
      if(!wedMap[k]) dayMap[k]=ev;
      d.setDate(d.getDate()+1);
    }
  });

  // Eventos de agenda por día (informativos, no forman parte de la custodia)
  const eventoMap={};
  S.eventosAgenda.forEach(e=>{
    if(!eventoMap[e.fecha]) eventoMap[e.fecha]=[];
    eventoMap[e.fecha].push(e);
  });

  const cal=el('div',{className:'card-dark',style:{padding:10,marginBottom:14}});
  const calHdr=el('div',{className:'cal-grid',style:{marginBottom:4}});
  ['L','M','X','J','V','S','D'].forEach(d=>calHdr.appendChild(el('div',{className:'cal-day-hdr'},d)));
  cal.appendChild(calHdr);

  const firstDay=new Date(UI.calYear,UI.calMonth,1).getDay();
  const dim=new Date(UI.calYear,UI.calMonth+1,0).getDate();
  const offset=(firstDay+6)%7;
  const grid=el('div',{className:'cal-grid'});

  for(let i=0;i<offset;i++) grid.appendChild(el('div',{}));
  for(let n=1;n<=dim;n++){
    const key=String(UI.calYear)+'-'+String(UI.calMonth+1).padStart(2,'0')+'-'+String(n).padStart(2,'0');
    const ev=dayMap[key];
    const wedEv=wedMap[key];
    const isTdy=key===today();
    const isPend=ev&&ev.changeStatus==='pendiente';

    let bgColor='transparent', textColor='var(--ink-soft)', borderStyle='none', clickEv=null;
    if(wedEv){
      bgColor='var(--alert-soft)'; textColor='var(--alert)'; borderStyle='1px dashed var(--alert)'; clickEv=wedEv;
    } else if(ev&&!isPend){
      bgColor=CUSTODY_BG[ev.who]; textColor=CUSTODY_TEXT[ev.who]; clickEv=ev;
    } else if(isPend){
      borderStyle='1px dashed var(--ink-soft)'; clickEv=ev;
    }

    const isFest = isFestivo(key);
    const eventosDia = eventoMap[key]||[];
    const cell=el('div',{
      className:'cal-cell'+(ev||wedEv?' has-event':''),
      style:{background:bgColor,position:'relative'},
      title:isFest?festivoName(key):(eventosDia.length?eventosDia.map(e=>e.titulo).join(', '):''),
      onClick:()=>{if(clickEv){UI.calSelected=clickEv;render();} else if(isFest){ alert('🎉 '+festivoName(key)); } else if(eventosDia.length){ UI.calSelectedEventos=eventosDia; render(); }}
    });
    cell.appendChild(el('div',{
      className:'cal-num'+(isTdy?' today':''),
      style:{color:isTdy?'':isFest&&!ev&&!wedEv?'var(--accent)':textColor, border:isTdy?'none':borderStyle}
    },String(n)));
    if(wedEv&&!isTdy) cell.appendChild(el('div',{style:{width:5,height:5,borderRadius:'50%',background:'var(--alert)',marginTop:1}}));
    if(isFest) cell.appendChild(el('div',{style:{width:5,height:5,borderRadius:'50%',background:'var(--accent)',marginTop:1,opacity:.9}}));
    if(eventosDia.length){
      const tipoInfo = EVENTO_TIPOS.find(t=>t.id===eventosDia[0].tipo)||EVENTO_TIPOS[EVENTO_TIPOS.length-1];
      cell.appendChild(el('div',{style:{position:'absolute',top:1,right:2,fontSize:9}},tipoInfo.icono));
    }
    grid.appendChild(cell);
  }
  cal.appendChild(grid);
  wrap.append(nav,leg,cal);
  return wrap;
}

function renderCalWeek(){
  const wrap=el('div',{});
  // Get Monday of current week
  const ref=new Date(); ref.setHours(12,0,0,0);
  const dow=ref.getDay(); const diff=dow===0?-6:1-dow;
  ref.setDate(ref.getDate()+diff+UI.weekOffset*7);

  const nav=el('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}});
  nav.append(
    el('button',{className:'btn-sm',onClick:()=>{UI.weekOffset=(UI.weekOffset||0)-1;render();}},'←'),
    el('span',{style:{fontWeight:700,fontSize:14}},'Semana del '+ref.toLocaleDateString('es-ES',{day:'numeric',month:'short'})),
    el('button',{className:'btn-sm',onClick:()=>{UI.weekOffset=(UI.weekOffset||0)+1;render();}},'→')
  );

  const dayMap={};
  S.events.forEach(ev=>{
    if(ev.changeStatus==='rechazado') return;
    let d=new Date(ev.from+'T12:00:00'),end=new Date(ev.to+'T12:00:00');
    while(d<=end){dayMap[d.toISOString().slice(0,10)]=ev;d.setDate(d.getDate()+1);}
  });
  const eventoMap={};
  S.eventosAgenda.forEach(e=>{
    if(!eventoMap[e.fecha]) eventoMap[e.fecha]=[];
    eventoMap[e.fecha].push(e);
  });

  const DNAMES=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const hdrRow=el('div',{className:'week-row'});
  const bodyRow=el('div',{className:'week-row'});

  for(let i=0;i<7;i++){
    const d=new Date(ref); d.setDate(d.getDate()+i);
    const key=d.toISOString().slice(0,10);
    const ev=dayMap[key];
    const isTdy=key===today();
    hdrRow.appendChild(el('div',{style:{textAlign:'center',fontSize:10,fontWeight:700,color:isTdy?'var(--jorge)':'var(--ink-soft)',paddingBottom:4}},DNAMES[i]));
    const isFestD=isFestivo(key);
    const festNm=festivoName(key);
    const eventosDia=eventoMap[key]||[];
    const cell=el('div',{
      className:'week-cell',
      style:{background:ev?CUSTODY_BG[ev.who]:'var(--paper)',border:isTdy?'1px solid var(--jorge)':isFestD?'1px solid var(--accent)22':'1px solid var(--line)',cursor:(ev||isFestD||eventosDia.length)?'pointer':'default',position:'relative'},
      title:isFestD?festNm:(eventosDia.length?eventosDia.map(e=>e.titulo).join(', '):''),
      onClick:()=>{if(ev){UI.calSelected=ev;render();}else if(isFestD){alert('🎉 '+festNm);}else if(eventosDia.length){UI.calSelectedEventos=eventosDia;render();}}
    });
    cell.append(
      el('div',{style:{fontSize:15,fontWeight:isTdy?800:600,color:ev?CUSTODY_TEXT[ev.who]:isFestD?'var(--accent)':'var(--ink-soft)'}},String(d.getDate())),
      ev?el('div',{style:{fontSize:10,color:CUSTODY_TEXT[ev.who],fontWeight:700}},nameOf(ev.who)):el('div',{style:{fontSize:10,color:isFestD?'var(--accent)':'var(--line)'}},isFestD?'🎉':'—')
    );
    if(eventosDia.length){
      const tipoInfo=EVENTO_TIPOS.find(t=>t.id===eventosDia[0].tipo)||EVENTO_TIPOS[EVENTO_TIPOS.length-1];
      cell.appendChild(el('div',{style:{position:'absolute',top:2,right:3,fontSize:10}},tipoInfo.icono));
    }
    bodyRow.appendChild(cell);
  }
  wrap.append(nav,hdrRow,bodyRow);
  return wrap;
}

function renderSolicitudForm(){
  const wrap=el('div',{className:'card fade-in',style:{marginBottom:12,borderColor:'var(--eva)'}});

  if(!UI.solicitudTipo){
    wrap.appendChild(el('div',{style:{fontWeight:700,fontSize:14,marginBottom:4,color:'var(--eva)'}},'¿Qué quieres solicitar?'));
    wrap.appendChild(el('div',{style:{fontSize:11,color:'var(--ink-soft)',marginBottom:12}},'Según lo pactado en el convenio regulador. Cualquier cambio en el calendario pasa por aquí y requiere aprobación del otro progenitor.'));

      const b=el('button',{
        style:{display:'flex',alignItems:'center',gap:10,width:'100%',textAlign:'left',padding:'11px 12px',marginBottom:6,background:'var(--paper)',border:'1px solid var(--line)',borderRadius:9,cursor:'pointer'},
        onClick:()=>{
          UI.solicitudTipo=t.id;
          UI.solicitudForm={from:today(),to:today(),motivo:'',eventIdAfectado:null,accion:'editar',quienNuevo:'J',aiText:'',aiLoading:false};
          render();

      });
      b.append(
        el('span',{style:{fontSize:20,flexShrink:0}},t.icono),
        el('div',{},[el('div',{style:{fontSize:13,fontWeight:600,color:'var(--line)'}},t.label)])
      );
      wrap.appendChild(b);
    });
    return wrap;
  }

  const tipo=SOLICITUD_TIPOS.find(t=>t.id===UI.solicitudTipo);
  const f=UI.solicitudForm;

  wrap.appendChild(el('button',{style:{background:'none',border:'none',color:'var(--eva)',fontSize:12,marginBottom:10,cursor:'pointer',padding:0},onClick:()=>{UI.solicitudTipo=null;render();}},'← Cambiar tipo de solicitud'));
  wrap.appendChild(el('div',{style:{fontWeight:700,fontSize:14,marginBottom:6,color:'var(--eva)'}},tipo.icono+' '+tipo.label));
  wrap.appendChild(el('div',{style:{fontSize:12,color:'var(--ink-soft)',marginBottom:14,lineHeight:1.5,padding:'8px 10px',background:'var(--bg)',borderRadius:8}},tipo.ayuda));

  // Selector de periodo existente + acción, solo para modificar_periodo
  if(tipo.esModificacion){
    const futuros=[...S.events].filter(ev=>ev.to>=today()&&ev.changeStatus!=='rechazado').sort((a,b)=>a.from.localeCompare(b.from));
    wrap.appendChild(el('div',{style:{marginBottom:10}},[lbl('¿Qué periodo quieres cambiar?')]));
    if(!futuros.length){
      wrap.appendChild(el('div',{style:{fontSize:12,color:'var(--ink-soft)',marginBottom:10}},'No hay periodos futuros en el calendario.'));
    } else {
      const selPeriodo=el('select',{className:'input',style:{marginBottom:10}});
      selPeriodo.appendChild(el('option',{value:''},'— Selecciona un periodo —'));
      futuros.forEach(ev=>{
        const o=el('option',{value:ev.id},nameOf(ev.who)+': '+fmt(ev.from)+' → '+fmt(ev.to)+(ev.note?' ('+ev.note+')':''));
        if(String(f.eventIdAfectado)===String(ev.id)) o.selected=true;
        selPeriodo.appendChild(o);
      });
      selPeriodo.addEventListener('change',e=>{
        UI.solicitudForm.eventIdAfectado=e.target.value||null;
        const ev=futuros.find(x=>String(x.id)===e.target.value);
        if(ev){ UI.solicitudForm.from=ev.from; UI.solicitudForm.to=ev.to; UI.solicitudForm.quienNuevo=ev.who; }
        render();
      });
      wrap.appendChild(selPeriodo);
    }
    // Acción: editar o cancelar
    const accWrap=el('div',{style:{display:'flex',gap:8,marginBottom:14}});
    [['editar','✏️ Cambiar fechas/quién'],['cancelar','🗑️ Cancelar este periodo']].forEach(([k,l])=>{
      accWrap.appendChild(el('button',{
        style:{flex:1,padding:9,borderRadius:9,border:'1px solid',borderColor:f.accion===k?'var(--eva)':'var(--line)',background:f.accion===k?'var(--eva-soft)':'transparent',color:f.accion===k?'var(--eva)':'var(--ink-soft)',fontWeight:f.accion===k?700:400,fontSize:12},
        onClick:()=>{UI.solicitudForm.accion=k;render();}
      },l));
    });
    wrap.appendChild(accWrap);
  }

  // Ayudante de IA para rellenar fechas a partir de texto (disponible cuando hay fechas que rellenar)
  if(!(tipo.esModificacion && f.accion==='cancelar')){
    wrap.appendChild(el('div',{style:{marginBottom:12,padding:'10px 12px',background:'var(--bg)',border:'1px dashed var(--eva-soft)',borderRadius:9}},[
      el('div',{style:{fontSize:11,color:'var(--eva)',marginBottom:6,fontWeight:600}},'🤖 ¿Prefieres describirlo en texto?'),
      (()=>{
        const aiRow=el('div',{style:{display:'flex',gap:6}});
        const aiInp=el('input',{className:'input',style:{flex:1,fontSize:12,padding:'7px 10px'},placeholder:'Ej: del 15 al 22 de julio con Eva por vacaciones'});
        aiInp.value=f.aiText||'';
        aiInp.addEventListener('input',e=>UI.solicitudForm.aiText=e.target.value);
        const aiBtn=el('button',{className:'btn-ghost',style:{fontSize:11,flexShrink:0,padding:'7px 12px'},onClick:async()=>{
          if(!f.aiText||!f.aiText.trim()) return;
          UI.solicitudForm.aiLoading=true;render();
          try{
            const prompt='Hoy es '+today()+'. Analiza este texto sobre un plan de custodia y devuelve SOLO un objeto JSON con estos campos exactos: who (J=Jorge, E=Eva, ambos), from (YYYY-MM-DD), to (YYYY-MM-DD), note (string breve con el motivo). Texto: "'+f.aiText+'". Responde SOLO con el JSON, sin explicación ni markdown.';
            const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:200,messages:[{role:'user',content:prompt}]})});
            const data=await resp.json();
            const text=data.content?.[0]?.text||'';
            const clean=text.replace(/```json|```/g,'').trim();
            const parsed=JSON.parse(clean);

    el('span',{},'📧'),

  ]));

  wrap.appendChild(el('button',{className:'btn-primary',style:{width:'100%',background:'var(--eva)'},onClick:async()=>{
    if(tipo.necesitaMotivo && !f.motivo.trim()){ alert('Este tipo de solicitud requiere indicar un motivo.'); return; }
    if(tipo.esModificacion && !f.eventIdAfectado){ alert('Selecciona qué periodo quieres modificar o cancelar.'); return; }

      tipo:tipo.id, from:f.from, to:f.to, motivo:f.motivo,

    UI.showSolicitudForm=false;UI.solicitudTipo=null;UI.solicitudForm={from:today(),to:today(),motivo:''};
  }},'Enviar solicitud'));

  return wrap;
}

      r.append(el('span',{style:{fontSize:12,color:CUSTODY_TEXT[p.who],fontWeight:600}},nameOf(p.who)),el('span',{style:{fontSize:11,color:'var(--ink-soft)'}},fmt(p.from)+' → '+fmt(p.to)+' · '+p.note));

    const events=generateWeeklySchedule(f.startDate,f.weeks,f.wednesdayMode);
    // Adjust startWith
    let whoWeek=f.startWith;
    const finalEvents=events.map(e=>{
      // already assigned in generator — but we need to override with startWith
      return e;

    // Regenerate with correct startWith
    const corrected=[];
    let cur=new Date(f.startDate+'T12:00:00');
    let who=f.startWith;
    const other=who==='J'?'E':'J';
    for(let w=0;w<f.weeks;w++){
      const mon=new Date(cur);const sun=new Date(cur);sun.setDate(sun.getDate()+6);

      const wedStr=wed.toISOString().slice(0,10);const thuStr=thu.toISOString().slice(0,10);
      const ot=who==='J'?'E':'J';
      if(f.wednesdayMode==='fixed_other'){
        corrected.push({from:monStr,to:addDays(monStr,1),who,note:'Turno semanal (L-M)',changeRequest:false});
        corrected.push({from:wedStr,to:wedStr,who:ot,note:'Miércoles fijo',changeRequest:false});
        corrected.push({from:thuStr,to:sunStr,who,note:'Turno semanal (J-D)',changeRequest:false});

        corrected.push({from:monStr,to:sunStr,who,note:'Turno semanal',changeRequest:false});
      }
      cur.setDate(cur.getDate()+7);who=ot;
    }
    await dbAddEventsBulk(corrected);
    UI.showWeekGen=false;
  }},'Generar turnos'));
  return form;
}

// Envía un email de recordatorio cuando un cambio de custodia real está a
// exactamente `alertDaysBefore` días vista. Se comprueba cada vez que se
// carga la app (no requiere navegador abierto en el momento exacto, a
// diferencia de las notificaciones push). Un registro en localStorage evita
// reenviar el mismo aviso varias veces el mismo día.
async function checkAndSendUpcomingReminders(){
  if(!S.user) return;
  const daysBefore=UI.alertDaysBefore;
  const todayStr=today();
  const custodyOnDay = dateStr => { const e=S.events.find(x=>x.from<=dateStr&&x.to>=dateStr&&x.changeStatus!=='rechazado'); return e?e.who:null; };
  const targetDate=addDays(todayStr,daysBefore);
  const sentKey='cp:remindersSent:'+todayStr;
  let sent=[];
  try{ sent=JSON.parse(localStorage.getItem(sentKey)||'[]'); }catch{}

  const candidatos=S.events.filter(ev=>
    ev.from===targetDate && ev.changeStatus!=='rechazado' &&
    custodyOnDay(addDays(ev.from,-1))!==ev.who
  );

  for(const ev of candidatos){
    const evId=String(ev.id);
    if(sent.includes(evId)) continue;
    const params={
      from_name:'Recordatorio automático',
      action:'Próximo cambio de custodia en '+daysBefore+' día'+(daysBefore>1?'s':''),
      who:nameOf(ev.who),
      from_date:fmt(ev.from), to_date:fmt(ev.to||ev.from),
      note:ev.note||'',
      days:'', app_url:window.location.origin+window.location.pathname,
    };
    for(const toEmail of [EMAIL_JORGE, EMAIL_EVA]){
      try{ await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {...params, to_email:toEmail}); }
      catch(e){ console.warn('Error enviando recordatorio a', toEmail, e); }
    }
    sent.push(evId);
  }
  if(candidatos.length) localStorage.setItem(sentKey, JSON.stringify(sent));
}
